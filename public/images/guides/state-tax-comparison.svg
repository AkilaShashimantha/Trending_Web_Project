<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="State Freelance Tax Burden Comparison Across Major US Jurisdictions">
  <rect width="1200" height="630" fill="#FBFBF9"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#FFFFFF" stroke="#EAEAE3" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="86" rx="24" fill="#16503E"/>
  <rect x="24" y="80" width="1152" height="30" fill="#16503E"/>
  <text x="64" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">State Freelance Income Tax + Entity Fee Comparison ($160,000 Net Profit)</text>
  <text x="64" y="94" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="600" fill="#6EE7B7">Single Filer  •  2026 Federal SECA + Income Tax Applies Everywhere  •  State &amp; Local Differential Only</text>

  <!-- Bars Card -->
  <rect x="64" y="142" width="1072" height="394" rx="18" fill="#FBFBF9" stroke="#EAEAE3" stroke-width="2"/>

  <!-- TX -->
  <text x="92" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#16503E">Texas (TX)</text>
  <text x="92" y="210" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">0% Income Tax • $0 LLC Fee (&lt;$2.65M)</text>
  <rect x="360" y="176" width="12" height="28" rx="4" fill="#059669"/>
  <text x="386" y="196" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#065F46">$0.00 State Income + Franchise Tax (High property tax offset)</text>

  <!-- FL -->
  <text x="92" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#16503E">Florida (FL)</text>
  <text x="92" y="274" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">0% Income Tax • $138.75 Sunbiz LLC</text>
  <rect x="360" y="240" width="18" height="28" rx="4" fill="#059669"/>
  <text x="392" y="260" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#065F46">$138.75 Annual LLC Report Only ($400 penalty if past May 1)</text>

  <!-- PA -->
  <text x="92" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Pennsylvania (PA)</text>
  <text x="92" y="338" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">3.07% Flat • +1%–3.75% Local EIT</text>
  <rect x="360" y="304" width="215" height="28" rx="6" fill="#0D9488"/>
  <text x="588" y="324" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0F766E">~$4,570 State (+ Local Act 32 EIT)</text>

  <!-- IL -->
  <text x="92" y="384" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Illinois (IL)</text>
  <text x="92" y="402" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">4.95% Flat • $75 Annual LLC Report</text>
  <rect x="360" y="368" width="335" height="28" rx="6" fill="#D97706"/>
  <text x="708" y="388" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#92400E">~$7,300 State + $75 LLC (+1.5% PPRT if S-Corp)</text>

  <!-- CA -->
  <text x="92" y="448" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A">California (CA)</text>
  <text x="92" y="466" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">1%–13.3% Graduated • $800 FTB LLC</text>
  <rect x="360" y="432" width="510" height="28" rx="6" fill="#DC2626"/>
  <text x="884" y="452" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#991B1B">~$12,015 ($11,215 Income + $800 LLC)</text>

  <!-- NYC -->
  <text x="92" y="510" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A">New York City (NYC)</text>
  <text x="92" y="528" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">NYS + NYC PIT + 4% UBT + MCTMT</text>
  <rect x="360" y="494" width="600" height="28" rx="6" fill="#991B1B"/>
  <text x="974" y="514" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#7F1D1D">~$15,400+ Layered Tax</text>

  <text x="64" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748B">Physical Work Rule: Operating remotely from a high-tax state triggers tax nexus there regardless of where an out-of-state LLC was formed.</text>
</svg>
